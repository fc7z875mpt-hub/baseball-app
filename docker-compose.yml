version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: baseball-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: baseball
      POSTGRES_PASSWORD: baseball
      POSTGRES_DB: baseball_app
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baseball -d baseball_app"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: baseball-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://baseball:baseball@db:5432/baseball_app?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: zmen-tento-tajny-klic-v-produkci
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
